<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json">
<title>Photo Caddy</title><link rel="stylesheet" href="style.css">
</head><body><main>
<header><div><span class="eyebrow">PHOTO CADDY</span><h1>Asistente fotográfico</h1><p>Configurado para tu cámara.</p></div><button id="install" class="install hidden">Instalar</button></header>
<section class="card">
<h2>Tu equipo</h2>
<label>Cámara</label><div class="chips" id="camera"></div>
<label>Objetivo</label><div class="chips" id="lens"></div>
</section>
<section class="card">
<h2>Describe la escena</h2>
<label>¿Qué vas a fotografiar?</label><div class="chips" id="subject"></div>
<label>¿Cómo está la luz?</label><div class="chips" id="light"></div>
<label>¿Qué situación tienes?</label><div class="chips" id="scene"></div>
<label>¿Hay movimiento?</label><div class="chips" id="movement"></div>
<label>Prioridad</label><div class="chips" id="priority"></div>
<button id="go" class="primary">DAME LOS AJUSTES</button>
</section>
<section id="result" class="card result hidden"></section>
<footer>v1.1 · Motor offline · Recomendaciones orientativas</footer>
</main><script src="app.js"></script></body></html>
